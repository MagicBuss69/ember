name = "ember-reminders"
main = "index.js"
compatibility_date = "2025-04-01"

# Create this with: npx wrangler kv namespace create EMBER
# Then paste the id here. Do not commit a real production id if you prefer;
# the placeholder deploy will fail until it is replaced.
[[kv_namespaces]]
binding = "EMBER"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["* * * * *"]

# Public key only. Set the same value in src/config.js.
# Private key is a secret: npx wrangler secret put VAPID_PRIVATE_JWK
[vars]
VAPID_PUBLIC_KEY = ""
